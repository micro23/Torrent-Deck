<h1>Layout</h1>

<table class="ui very basic table">
    <thead>
        <tr>
            <th class="two wide">Order</th>
            <th class="two wide">Enabled</th>
            <th class="twelve wide">Name</th>
        </tr>
    </thead>
    <tbody ui-sortable="ctl.sortOptions" ng-model="ctl.server.columns">
        <tr ng-repeat="col in ctl.server.columns track by col.attribute">
            <td style="min-width: 12em">
                <button type="button" class="ui basic compact icon button sort handle"
                    ng-attr-aria-label="Move {{col.name}} column with the up and down arrow keys"
                    title="Drag or use the arrow keys to move this column"
                    ng-keydown="ctl.moveColumn($event, $index)">
                    <i class="sort icon" aria-hidden="true"></i>
                </button>
            </td>
            <td style="min-width: 12em">
                <div class="ui checkbox">
                    <input type="checkbox" ng-model="col.enabled"><label></label>
                </div>
            </td>
            <td style="width: 100%">{{col.name}}</td>
        </tr>
    </tbody>
</table>
