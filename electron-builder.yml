electronLanguages:
  - en
directories:
  output: dist
  buildResources: build
toolsets:
  appimage: 1.0.3
productName: Torrent-Deck
appId: com.github.micro23.torrentdeck
executableName: torrent-deck
extraResources:
  - from: assets/torrent-deck.png
    to: torrent-deck.png
publish:
  - provider: github
    owner: micro23
    repo: Torrent-Deck
    releaseType: draft
files:
  - '!**/*.map'
mac:
  artifactName: "${productName}-${version}-macOS-${arch}.${ext}"
  category: public.app-category.utilities
  hardenedRuntime: true
  notarize: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  extendInfo:
    NSLocalNetworkUsageDescription: Torrent-Deck connects to torrent clients running on devices on your local network.
    CFBundleDocumentTypes:
      - CFBundleTypeName: BitTorrent document
        CFBundleTypeRole: Viewer
        LSHandlerRank: Owner
        LSItemContentTypes:
          - org.bittorrent.torrent
    UTImportedTypeDeclarations:
      - UTTypeIdentifier: org.bittorrent.torrent
        UTTypeDescription: BitTorrent document
        UTTypeConformsTo:
          - public.data
        UTTypeTagSpecification:
          public.filename-extension: torrent
          public.mime-type: application/x-bittorrent
  target:
    - target: zip
      arch:
        - universal
win:
  artifactName: "${productName}-${version}-Windows-${arch}.${ext}"
  target: nsis
linux:
  artifactName: "${productName}-${version}-Linux-${arch}.${ext}"
  icon: build/png
  category: Network;FileTransfer;P2P;
  desktop:
    entry:
      MimeType: application/x-bittorrent;x-scheme-handler/magnet;
      Keywords: p2p;bittorrent;
  target:
    - snap
    - AppImage
    - deb
    - rpm
extraFiles:
  - filter:
      - resources
fileAssociations:
  - ext: torrent
    name: Torrent-Deck Torrent
    role: Viewer
    rank: Owner
    mimeType: application/x-bittorrent
    description: Torrent Files
afterPack: ./util/after-pack.js
afterAllArtifactBuild: ./util/after-sign.js
electronVersion: 42.11.10
