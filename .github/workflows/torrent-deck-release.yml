name: Torrent-Deck Release

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      build_only:
        description: 'Build installers only when the same application changes have already passed client validation'
        type: boolean
        default: false
      clients:
        description: 'JSON array of explicitly requested clients; empty tests Deluge only'
        required: false
        default: ''
      spec:
        description: 'Optional targeted test spec'
        required: false
        default: ''
  schedule:
    - cron: '0 0 * * 0' # every Sunday at midnight

permissions:
  contents: read

env:
  NODE_VERSION: 22.x
  ELECTRON_IS_DEV: 0

jobs:
  test:
    if: inputs.build_only != true
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        client: ${{ fromJSON(inputs.clients || '["deluge:2"]') }}

    steps:
    - name: Checkout source code
      uses: actions/checkout@v7
    - name: Install dependencies
      run: >
        sudo apt-get update && sudo apt-get install -y
        xvfb
        libnss3-dev
        libdbus-1-dev
        libatk1.0-dev
        libatk-bridge2.0-dev
        libcups2-dev
        libgtk-3-0
        libgbm1
        libasound2t64
    - name: Install nodejs
      uses: actions/setup-node@v7
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    - name: Cache npm modules
      uses: actions/cache@v6
      with:
        path: |
          node_modules
          */*/node_modules
        key: ${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
    - name: Install npm dependencies
      run: npm install
    - name: Lint
      run: npm run lint
    - name: Test GitHub updater
      run: node --test test/unit/github-updater.test.cjs test/unit/torrent-state.test.cjs test/unit/server-origin.test.cjs test/unit/deluge-upload.test.cjs test/unit/torrent-file-association.test.cjs test/unit/torrent-file-opening.test.cjs test/unit/launch-queue.test.cjs
    - name: Build web application
      run: npm run build
    - name: Run tests
      env:
        TEST_CLIENT: ${{ matrix.client }}
        TEST_SPEC: ${{ inputs.spec }}
        ELECTORRENT_TEST_REDUCED_MOTION: "1"
      run: |
        args=(--client "$TEST_CLIENT" --headless)
        if [ -n "$TEST_SPEC" ]; then
          args+=(--spec "$TEST_SPEC")
        elif [[ "$GITHUB_REF" == refs/tags/v* || "$GITHUB_EVENT_NAME" == pull_request ]]; then
          # Validate uploads, columns, and content sizing for PRs/releases; master and schedule run the full suite.
          args+=(--spec test/specs/standard/torrent-uploads.spec.ts --spec test/specs/standard/torrent-file-inputs.spec.ts --spec test/specs/standard/torrent-column-resize.spec.ts --spec test/specs/standard/content-size.spec.ts)
        fi
        xvfb-run -a --server-args="-screen 0 1600x1200x24" -- npm test -- "${args[@]}"

  build:
    if: inputs.clients == ''
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Install apt packages
      run: sudo apt-get update && sudo apt-get install -y graphicsmagick icnsutils
      if: runner.os == 'Linux'
    - name: Checkout source code
      uses: actions/checkout@v7
    - name: Install nodejs
      uses: actions/setup-node@v7
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    - name: Cache npm modules
      uses: actions/cache@v6
      with:
        path: |
          node_modules
          */*/node_modules
        key: ${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
    - name: Install npm dependencies
      run: npm install
    - name: Test native file paths, launch queue, and updater
      run: node --test test/unit/github-updater.test.cjs test/unit/torrent-file-opening.test.cjs test/unit/torrent-file-association.test.cjs test/unit/launch-queue.test.cjs
    - name: Verify release version
      if: startsWith(github.ref, 'refs/tags/v')
      shell: bash
      run: |
        node --input-type=module -e 'import fs from "node:fs"; const root = JSON.parse(fs.readFileSync("package.json")); const app = JSON.parse(fs.readFileSync("app/package.json")); if (process.env.GITHUB_REF_NAME !== `v${root.version}` || app.version !== root.version) throw new Error("Release tag must match both package versions")'
    - name: Build Windows installer and updater metadata
      if: runner.os == 'Windows'
      run: npm run dist -- --win nsis
    - name: Verify Windows update dialog with system animations disabled
      if: runner.os == 'Windows'
      run: npm test -- --dist --client deluge:2 --spec test/specs/mock/software-update.spec.ts --headless
      env:
        ELECTORRENT_TEST_BINARY: dist/win-unpacked/torrent-deck.exe
        ELECTORRENT_TEST_NO_BACKEND: "1"
        ELECTORRENT_TEST_REDUCED_MOTION: "1"
        ELECTORRENT_TEST_UPDATE_URL: http://127.0.0.1:43871/update
    - name: Build distribution
      if: runner.os == 'Linux'
      run: npm run dist
    - name: Check macOS release signing credentials
      id: macos_signing
      if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
      shell: bash
      env:
        CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
        CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: |
        if [ -n "$CSC_LINK" ] && [ -n "$CSC_KEY_PASSWORD" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
          echo "available=true" >> "$GITHUB_OUTPUT"
        else
          echo "available=false" >> "$GITHUB_OUTPUT"
          echo "::notice::Building an unsigned universal macOS ZIP because signing and notarization credentials are not configured."
        fi
    - name: Build signed and notarized universal macOS release
      if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v') && steps.macos_signing.outputs.available == 'true'
      run: npm run dist -- --mac zip --universal --config.extraMetadata.manualMacUpdates=true
      env:
        CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
        CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    - name: Build unsigned universal macOS release
      if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v') && steps.macos_signing.outputs.available != 'true'
      run: npm run dist -- --mac zip --universal --config.mac.notarize=false --config.extraMetadata.manualMacUpdates=true
      env:
        CSC_IDENTITY_AUTO_DISCOVERY: false
    - name: Verify macOS signature and notarization
      if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v') && steps.macos_signing.outputs.available == 'true'
      shell: bash
      run: |
        for app in dist/mac-universal/torrent-deck.app; do
          test -d "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose "$app"
          xcrun stapler validate "$app"
        done
    - name: Upload Windows installer and update metadata
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v7
      with:
        name: torrent-deck-dist-${{ runner.os }}
        path: |
          dist/*.exe
          dist/*.blockmap
          dist/latest*.yml
        if-no-files-found: error
    - name: Upload macOS architecture ZIPs
      if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
      uses: actions/upload-artifact@v7
      with:
        name: torrent-deck-dist-${{ runner.os }}
        path: dist/*.zip
        if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download distributions
      uses: actions/download-artifact@v8
      with:
        pattern: torrent-deck-dist-*
        path: release-assets
        merge-multiple: true
    - name: Create draft release with installers and update metadata
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: micro23/Torrent-Deck
        RELEASE_TAG: ${{ github.ref_name }}
      run: |
        title="Torrent-Deck ${RELEASE_TAG#v} — Windows"
        if compgen -G 'release-assets/*.zip' > /dev/null; then
          title="Torrent-Deck ${RELEASE_TAG#v} — macOS and Windows"
        fi
        if gh release view "$RELEASE_TAG" --json isDraft > release.json 2>/dev/null; then
          node -e 'if (!require("./release.json").isDraft) throw new Error("Refusing to overwrite a published release")'
        else
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "$title" --generate-notes
        fi
        gh release upload "$RELEASE_TAG" release-assets/* --clobber
        gh release edit "$RELEASE_TAG" --draft=false
